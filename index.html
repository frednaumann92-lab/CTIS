<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Command & Unit ETA Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --bg-dark: #111;
            --bg-card: #2c2c2c;
            --text-white: #ffffff;
            --accent-green: #38c172; 
            --accent-blue: #0099ff; 
            --warning-yellow: #ffc107; 
            --alert-red: #dc3545; 
            --critical-dark-red: #9e1b29;
            --cat-med: #ff4747;    
            --cat-fire: #ff9900;   
            --cat-pd: #0099ff;     
            --cat-support: #33cc33; 
            --cat-unknown: #808080;  
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-dark);
            color: var(--text-white);
            padding: 25px;
            margin: 0;
            transition: all 0.5s;
        }

        h1, h2, h3 { color: var(--text-white); text-transform: uppercase; }

        .main-container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1500px; 
            margin-bottom: 30px;
        }

        body.wallboard-mode .main-container { max-width: 1800px; }
        
        .system-time-container, .tracker-section, .incident-management {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--bg-card); 
        }

        .system-time-container { width: 300px; display: flex; flex-direction: column; }
        .tracker-section { flex: 2; }
        .incident-management { flex: 1.5; display: flex; flex-direction: column; }
        
        #digital-clock {
            font-size: 3em;
            font-weight: bold;
            color: var(--text-white);
            margin-bottom: 10px;
            text-align: center;
            padding: 10px;
            border: 2px solid var(--text-white);
            border-radius: 3px;
            background-color: #000;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4); 
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }
        
        #current-date {
            font-size: 1.1em;
            text-align: center;
            color: var(--accent-green);
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .countdown-display h3 { color: var(--accent-blue); margin-bottom: 5px; font-size: 1em; }
        #shift-countdown-timer { font-size: 2em; font-weight: bold; color: var(--text-white); }

        #incident-display {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--warning-yellow);
            text-align: center;
            padding: 10px;
            border: 1px solid var(--warning-yellow);
            border-radius: 3px;
            margin-bottom: 15px;
            background-color: #333;
        }
        
        #incident-name-display {
             font-size: 1.5em;
             font-weight: bold;
             color: var(--accent-blue);
             text-align: center;
             margin-bottom: 15px;
        }

        #incident-log-container {
            background-color: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            flex-grow: 1;
            padding: 10px;
            max-height: 400px;
            overflow-y: auto;
            display: flex; 
            flex-direction: column-reverse; 
        }

        .log-entry { border-bottom: 1px dashed #3a3a3a; padding: 5px 0; font-size: 0.9em; color: #ccc; }
        .log-time { color: var(--accent-blue); font-weight: bold; margin-right: 8px; }

        .toggle-mode-container {
            width: 100%;
            max-width: 1500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        #sync-status {
            font-size: 0.85em;
            color: var(--warning-yellow);
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 3px;
            border: 1px solid #333;
            cursor: pointer;
            user-select: none;
        }

        #status-summary {
             display: flex;
             justify-content: space-around;
             margin-bottom: 20px;
             text-align: center;
             background-color: #1a1a1a;
             padding: 10px;
             border-radius: 5px;
        }
        .status-box { padding: 5px 15px; }
        .status-count { font-size: 1.5em; font-weight: bold; color: var(--accent-green); }
        .status-label { font-size: 0.8em; color: #aaa; text-transform: uppercase; }

        input[type="text"], select, input[type="number"] {
            padding: 10px; border: 1px solid #555; border-radius: 3px; background-color: #3a3a3a; color: var(--text-white); font-family: 'Consolas', monospace;
        }
        select { min-width: 100px; }

        .tracker-controls, .incident-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tracker-controls input[type="number"] { width: 80px; }
        
        .tracker-controls button, .incident-controls button, #mode-toggle-button {
            padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: background-color 0.2s;
        }
        #mode-toggle-button { background-color: var(--accent-blue); color: var(--bg-dark); }
        
        #trackers-list { list-style: none; padding: 0; margin: 0; }
        
        .tracker-item {
            display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; background-color: #3a3a3a; border-radius: 5px; border-left: 5px solid var(--cat-unknown); 
        }

        .tracker-item[data-category="MED"] { border-left-color: var(--cat-med); }
        .tracker-item[data-category="FIRE"] { border-left-color: var(--cat-fire); }
        .tracker-item[data-category="PD"] { border-left-color: var(--cat-pd); }
        .tracker-item[data-category="SUPPORT"] { border-left-color: var(--cat-support); }
        .tracker-item[data-category="UNKNOWN"] { border-left-color: var(--cat-unknown); }
        
        .tracker-info { display: flex; flex-direction: column; }
        .tracker-category { font-size: 0.8em; color: #ccc; text-transform: uppercase; }

        .tracker-item.warning-status { background-color: #4a4a3a; }
        .tracker-item.alert-status { background-color: var(--alert-red); border-left: 5px solid var(--text-white) !important; box-shadow: 0 0 10px rgba(220, 53, 69, 0.8); }
        @keyframes pulse {
            0% { background-color: var(--critical-dark-red); }
            50% { background-color: var(--alert-red); }
            100% { background-color: var(--critical-dark-red); }
        }
        .tracker-item.expired-status { animation: pulse 1s infinite alternate; border-left: 5px solid var(--warning-yellow) !important; box-shadow: 0 0 15px var(--alert-red); }

        .tracker-name { font-weight: bold; font-size: 1.2em; color: var(--text-white); text-transform: capitalize; }
        .tracker-time { font-size: 1.6em; color: var(--text-white); text-shadow: 0 0 3px rgba(255, 255, 255, 0.5); }
        .tracker-time.overdue { color: var(--warning-yellow); }
        
        .scene-btn { background-color: var(--accent-green); color: var(--bg-dark); font-weight: bolder; }
        .delete-btn { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    
    <div class="toggle-mode-container">
        <div id="sync-status" title="Click to change your Sync Room ID">⚡ SYNC: CONNECTING...</div>
        <button id="mode-toggle-button">ACTIVATE WALLBOARD MODE</button>
    </div>

    <h1><span style="color:var(--accent-green)">// COMMAND</span> <span style="color:var(--text-white)">ETA & INCIDENT SYSTEM</span></h1>

    <div class="main-container">
        <div class="system-time-container">
            <h2>Current System Time</h2>
            <div id="digital-clock"></div>
            <div id="current-date"></div>
            <div class="countdown-display">
                <h3>SHIFT END COUNTDOWN</h3>
                <div id="shift-countdown-timer">--:--:--</div>
            </div>
        </div>
        
        <div class="incident-management">
            <h2>Incident Command Log <button id="export-log" disabled>EXPORT LOG</button></h2>
            <div id="incident-name-display" style="display:none;"></div>
            <h3 style="color:var(--warning-yellow);">Incident Timer Elapsed:</h3>
            <div id="incident-display">00:00:00.00</div>

            <div class="incident-controls">
                <input type="text" id="incident-name-input" placeholder="ENTER INCIDENT NAME" value="ACTIVE INCIDENT">
                <button id="start-incident">ACTIVATE</button>
                <button id="end-incident" style="display:none;">TERMINATE</button>
            </div>
            
            <h3>Log Entry:</h3>
            <div class="incident-controls">
                <input type="text" id="log-entry-input" placeholder="Enter log details" disabled>
                <button id="add-log" disabled>LOG ENTRY</button>
            </div>
            
            <div id="incident-log-container"></div>
        </div>

        <div class="tracker-section">
            <h2>Unit ETA Countdown Tracker</h2>
            
            <div id="status-summary">
                <div class="status-box" id="total-count"><div class="status-count">0</div><div class="status-label">En Route Units</div></div>
                <div class="status-box" id="alert-count"><div class="status-count">0</div><div class="status-label">Overdue / Expired</div></div>
            </div>

            <div class="tracker-controls">
                <select id="unit-category-select">
                    <option value="UNKNOWN">-- SELECT CATEGORY --</option>
                    <option value="MED">MED (Medical)</option>
                    <option value="FIRE">FIRE (Fire/Rescue)</option>
                    <option value="PD">PD (Police)</option>
                    <option value="SUPPORT">SUPPORT (Logistics/Other)</option>
                </select>
                <input type="text" id="tracker-name-input" placeholder="UNIT ID / NAME" style="flex-grow: 1;">
                <input type="number" id="tracker-eta-input" placeholder="ETA (min)" value="5" min="0.5" step="0.5">
                <button id="start-tracker">➕ ADD UNIT ETA</button>
                <button id="reset-tracker">GLOBAL WIPE</button>
            </div>

            <ul id="trackers-list"></ul>
        </div>
    </div>

    <script>
        const digitalClock = document.getElementById('digital-clock');
        const currentDateDisplay = document.getElementById('current-date');
        const shiftCountdownTimer = document.getElementById('shift-countdown-timer'); 
        const syncStatusDisplay = document.getElementById('sync-status');
        const originalTitle = document.title;
        let alertInterval, beepInterval;
        
        const body = document.body;
        const modeToggleButton = document.getElementById('mode-toggle-button');
        const incidentDisplay = document.getElementById('incident-display');
        const incidentNameInput = document.getElementById('incident-name-input');
        const incidentNameDisplay = document.getElementById('incident-name-display');
        const startIncidentBtn = document.getElementById('start-incident');
        const endIncidentButton = document.getElementById('end-incident');
        const logEntryInput = document.getElementById('log-entry-input');
        const addLogButton = document.getElementById('add-log');
        const exportLogButton = document.getElementById('export-log');
        const incidentLogContainer = document.getElementById('incident-log-container');
        
        const trackersList = document.getElementById('trackers-list');
        const trackerNameInput = document.getElementById('tracker-name-input');
        const trackerEtaInput = document.getElementById('tracker-eta-input');
        const startTrackerButton = document.getElementById('start-tracker');
        const resetButton = document.getElementById('reset-tracker');
        const unitCategorySelect = document.getElementById('unit-category-select'); 

        const totalCountDisplay = document.querySelector('#total-count .status-count');
        const alertCountDisplay = document.querySelector('#alert-count .status-count');

        let activeTrackers = []; 
        let logHistory = [];
        let mainTimerInterval; 
        let alertIsActive = false;
        const SHIFT_END_HOUR = 6; 

        let incidentTimer = { isRunning: false, startTime: 0, totalTime: 0, name: "NO ACTIVE INCIDENT" };
        let isWallboardMode = false;
        
        const myDeviceId = 'dev_' + Math.random().toString(36).substr(2, 9);
        let syncChannelId = localStorage.getItem("ics_sync_room_id") || "dispatch-channel-01";
        let mqttClient = null;
        let isReceivingRemoteState = false;
        const LOCAL_STORAGE_KEY = "ics_dispatch_local_sync_state";

        function initSyncNetwork() {
            syncStatusDisplay.textContent = `⚡ SYNC: CONNECTING (${syncChannelId})...`;
            syncStatusDisplay.style.color = "var(--warning-yellow)";

            mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
                clientId: myDeviceId,
                keepalive: 30,
                reconnectPeriod: 2000
            });

            mqttClient.on('connect', () => {
                syncStatusDisplay.textContent = `🟢 SYNC: ONLINE (ROOM: ${syncChannelId})`;
                syncStatusDisplay.style.color = "var(--accent-green)";
                mqttClient.subscribe(`ics/dispatch/${syncChannelId}`, { qos: 1 });
            });

            mqttClient.on('offline', () => {
                syncStatusDisplay.textContent = `🔴 SYNC: OFFLINE (LOCAL MODE)`;
                syncStatusDisplay.style.color = "var(--alert-red)";
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const payload = JSON.parse(message.toString());
                    if (payload.sender !== myDeviceId) {
                        applyRemoteState(payload);
                    }
                } catch (e) {}
            });
        }

        syncStatusDisplay.addEventListener('click', () => {
            let customId = prompt("Enter custom Sync Room Name:", syncChannelId);
            if (customId && customId.trim() !== '') {
                syncChannelId = customId.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
                localStorage.setItem("ics_sync_room_id", syncChannelId);
                if (mqttClient) {
                    mqttClient.end(true, () => initSyncNetwork());
                } else {
                    initSyncNetwork();
                }
            }
        });

        function pushStateToNetwork() {
            const stateData = {
                sender: myDeviceId,
                activeTrackers,
                logHistory,
                incidentTimer,
                lastUpdated: Date.now()
            };
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(stateData));
            if (mqttClient && mqttClient.connected && !isReceivingRemoteState) {
                mqttClient.publish(`ics/dispatch/${syncChannelId}`, JSON.stringify(stateData), { qos: 1, retain: false });
            }
        }

        function applyRemoteState(data) {
            if (!data) return;
            isReceivingRemoteState = true;
            if (data.activeTrackers) activeTrackers = data.activeTrackers;
            if (data.incidentTimer) incidentTimer = data.incidentTimer;
            if (data.logHistory) {
                logHistory = data.logHistory;
                incidentLogContainer.innerHTML = '';
                logHistory.slice().reverse().forEach(logString => {
                    const match = logString.match(/^\[(.*?)\]\s(.*)$/);
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    if (match) entry.innerHTML = `<span class="log-time">[${match[1]}]</span> ${match[2]}`;
                    incidentLogContainer.appendChild(entry);
                });
                exportLogButton.disabled = logHistory.length === 0;
            }
            renderTrackers();
            if ((activeTrackers.length > 0 || incidentTimer.isRunning) && !mainTimerInterval) startMainUpdateLoop();
            isReceivingRemoteState = false;
        }

        let audioCtx = null;
        function initAudioContext() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }
        function playBeep() {
            try {
                initAudioContext();
                if (!audioCtx || audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
        }
        ['click', 'keydown', 'touchstart'].forEach(e => window.addEventListener(e, initAudioContext, { once: false, passive: true }));

        function formatCountdown(ms) {
            const isNegative = ms < 0;
            const absMs = Math.abs(ms);
            const totalSeconds = Math.floor(absMs / 1000);
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            const minutes = String(Math.floor(totalSeconds / 60) % 60).padStart(2, '0');
            const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            return `${isNegative ? '-' : ''}${hours}:${minutes}:${seconds}`;
        }

        class UnitTracker {
            constructor(name, category, etaMinutes) {
                this.id = Date.now() + Math.floor(Math.random() * 1000);
                this.name = name;
                this.category = category;
                this.targetTime = Date.now() + (etaMinutes * 60000);
            }
            getRemainingTime() {
                return this.targetTime - Date.now();
            }
            getStatusClass() {
                return this.getRemainingTime() <= 0 ? 'expired-status' : '';
            }
        }

        function updateGlobalClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0').slice(0, 2); 
            digitalClock.textContent = `${hours}:${minutes}:${seconds}.${milliseconds}`;
            currentDateDisplay.textContent = `${now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase()}`;
            
            let shiftEnd = new Date(now);
            shiftEnd.setHours(SHIFT_END_HOUR, 0, 0, 0);
            if (now.getTime() >= shiftEnd.getTime()) shiftEnd.setDate(shiftEnd.getDate() + 1);
            shiftCountdownTimer.textContent = formatCountdown(shiftEnd.getTime() - now.getTime());
        }
        setInterval(updateGlobalClock, 100); 
        updateGlobalClock(); 

        function setAlertStatus(isActive) {
            if (isActive === alertIsActive) return;
            alertIsActive = isActive;
            if (alertIsActive) {
                if (!alertInterval) alertInterval = setInterval(() => {
                    document.title = document.title === originalTitle ? `*** OVERDUE ETA ***` : originalTitle;
                }, 500);
                playBeep();
                if (!beepInterval) beepInterval = setInterval(playBeep, 1200); 
            } else {
                clearInterval(alertInterval);
                alertInterval = null;
                clearInterval(beepInterval);
                beepInterval = null;
                document.title = originalTitle;
            }
        }

        modeToggleButton.addEventListener('click', () => {
            isWallboardMode = !isWallboardMode;
            body.classList.toggle('wallboard-mode', isWallboardMode);
            modeToggleButton.textContent = isWallboardMode ? 'EXIT WALLBOARD MODE' : 'ACTIVATE WALLBOARD MODE';
            modeToggleButton.style.backgroundColor = isWallboardMode ? 'var(--alert-red)' : 'var(--accent-blue)';
            renderTrackers();
        });

        function logEntry(text) {
            const timestamp = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            logHistory.push(`[${timestamp}] ${text}`);
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${timestamp}]</span> ${text}`;
            incidentLogContainer.prepend(entry);
            exportLogButton.disabled = false;
        }

        startIncidentBtn.addEventListener('click', () => {
            if (!incidentTimer.isRunning) {
                const name = incidentNameInput.value.trim().toUpperCase() || "UNNAMED INCIDENT";
                incidentTimer.isRunning = true;
                incidentTimer.startTime = Date.now();
                incidentTimer.totalTime = 0;
                incidentTimer.name = name; 
                incidentNameInput.style.display = 'none';
                incidentNameDisplay.textContent = `// ACTIVE INCIDENT: ${name}`;
                incidentNameDisplay.style.display = 'block';
                startIncidentBtn.style.display = 'none';
                endIncidentButton.style.display = 'block';
                logEntryInput.disabled = false;
                addLogButton.disabled = false;
                logEntry(`INCIDENT ACTIVATED: ${name}.`);
                if (!mainTimerInterval) startMainUpdateLoop(); 
                pushStateToNetwork();
            }
        });

        endIncidentButton.addEventListener('click', () => {
            if (incidentTimer.isRunning) {
                incidentTimer.isRunning = false;
                logEntry(`INCIDENT TERMINATED: ${incidentTimer.name}.`);
                incidentNameInput.style.display = 'block';
                incidentNameDisplay.style.display = 'none';
                startIncidentBtn.style.display = 'block';
                endIncidentButton.style.display = 'none';
                logEntryInput.disabled = true;
                addLogButton.disabled = true;
                if (activeTrackers.length === 0) stopMainUpdateLoop();
                pushStateToNetwork();
            }
        });

        addLogButton.addEventListener('click', () => {
            const text = logEntryInput.value.trim();
            if (text && incidentTimer.isRunning) {
                logEntry(text.toUpperCase());
                logEntryInput.value = '';
                pushStateToNetwork();
            }
        });

        function updateStatusSummary() {
            const overdue = activeTrackers.filter(t => t.getRemainingTime() <= 0).length;
            totalCountDisplay.textContent = activeTrackers.length;
            alertCountDisplay.textContent = overdue;
            setAlertStatus(overdue > 0);
        }

        function renderTrackers() {
            trackersList.innerHTML = ''; 
            activeTrackers.forEach(t => {
                const li = document.createElement('li');
                const remaining = t.getRemainingTime();
                const isOverdue = remaining <= 0;
                li.className = `tracker-item ${t.getStatusClass()}`;
                li.setAttribute('data-id', t.id);

                let actions = '';
                if (!isWallboardMode) {
                    actions = `
                        <button class="scene-btn">✅ ON SCENE</button>
                        <button class="delete-btn">DROP</button>
                    `;
                }

                li.innerHTML = `
                    <div class="tracker-info">
                        <span class="tracker-name">${t.name}</span>
                        <span class="tracker-category">${t.category}</span>
                    </div>
                    <span class="tracker-time ${isOverdue ? 'overdue' : ''}">${formatCountdown(remaining)}</span>
                    <div class="tracker-actions">${actions}</div>
                `;
                trackersList.appendChild(li);
            });
            updateStatusSummary();
        }

        trackersList.onclick = (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const li = e.target.closest('.tracker-item');
            if (!li) return;
            const id = parseInt(li.getAttribute('data-id'));
            const tracker = activeTrackers.find(t => t.id === id);
            if (!tracker) return;

            if (btn.classList.contains('scene-btn')) {
                logEntry(`UNIT ON SCENE: ${tracker.name}`);
            } else if (btn.classList.contains('delete-btn')) {
                logEntry(`UNIT CLEARED / DROPPED: ${tracker.name}`);
            }
            activeTrackers = activeTrackers.filter(t => t.id !== id);
            renderTrackers();
            if (activeTrackers.length === 0 && !incidentTimer.isRunning) stopMainUpdateLoop();
            pushStateToNetwork();
        };

        startTrackerButton.addEventListener('click', () => {
            const name = trackerNameInput.value.trim().toUpperCase() || "UNIT";
            const cat = unitCategorySelect.value.toUpperCase();
            const eta = parseFloat(trackerEtaInput.value) || 5;
            activeTrackers.push(new UnitTracker(name, cat, eta));
            trackerNameInput.value = '';
            logEntry(`UNIT EN ROUTE: ${name} (${cat}) - ETA ${eta}m`);
            if (!mainTimerInterval) startMainUpdateLoop();
            renderTrackers();
            pushStateToNetwork();
        });

        resetButton.addEventListener('click', () => {
            if (confirm("Purge all trackers?")) {
                activeTrackers = [];
                if (!incidentTimer.isRunning) stopMainUpdateLoop();
                renderTrackers();
                logEntry("GLOBAL WIPE executed.");
                pushStateToNetwork();
            }
        });

        function updateMainTimers() {
            if (incidentTimer.isRunning) {
                const now = Date.now();
                incidentTimer.totalTime += (now - incidentTimer.startTime);
                incidentTimer.startTime = now;
                incidentDisplay.textContent = formatCountdown(incidentTimer.totalTime).replace('-', '');
            }
            activeTrackers.forEach(t => {
                const timeSpan = trackersList.querySelector(`[data-id="${t.id}"] .tracker-time`);
                if (timeSpan) {
                    const rem = t.getRemainingTime();
                    timeSpan.textContent = formatCountdown(rem);
                    timeSpan.classList.toggle('overdue', rem <= 0);
                    const li = trackersList.querySelector(`[data-id="${t.id}"]`);
                    if (li) li.className = `tracker-item ${t.getStatusClass()}`;
                }
            });
            updateStatusSummary();
        }

        function startMainUpdateLoop() {
            if (mainTimerInterval) clearInterval(mainTimerInterval);
            mainTimerInterval = setInterval(updateMainTimers, 200);
        }
        function stopMainUpdateLoop() {
            if (mainTimerInterval) { clearInterval(mainTimerInterval); mainTimerInterval = null; }
        }

        if (localStorage.getItem(LOCAL_STORAGE_KEY)) {
            try { applyRemoteState(JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY))); } catch(e){}
        }
        initSyncNetwork();
    </script>
</body>
</html>
