<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Command & Unit Status Tracker</title>
    <style>
        :root {
            --bg-dark: #111;
            --bg-card: #2c2c2c;
            --text-white: #ffffff;
            --accent-green: #38c172; 
            --accent-blue: #0099ff; 
            --warning-yellow: #ffc107; 
            --alert-red: #dc3545; 
            --critical-dark-red: #9e1b29;
            --cat-med: #ff4747;    
            --cat-fire: #ff9900;   
            --cat-pd: #0099ff;     
            --cat-support: #33cc33; 
            --cat-unknown: #808080;  
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-dark);
            color: var(--text-white);
            padding: 25px;
            margin: 0;
            transition: all 0.5s;
        }

        h1, h2, h3 { color: var(--text-white); text-transform: uppercase; }

        .main-container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1500px; 
            margin-bottom: 30px;
        }

        body.wallboard-mode .main-container { max-width: 1800px; }
        
        .system-time-container, .tracker-section, .incident-management {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--bg-card); 
        }

        .system-time-container { width: 300px; display: flex; flex-direction: column; }
        .tracker-section { flex: 2; }
        .incident-management { flex: 1.5; display: flex; flex-direction: column; }
        
        #digital-clock {
            font-size: 3em;
            font-weight: bold;
            color: var(--text-white);
            margin-bottom: 10px;
            text-align: center;
            padding: 10px;
            border: 2px solid var(--text-white);
            border-radius: 3px;
            background-color: #000;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4); 
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }
        
        body.wallboard-mode #digital-clock { font-size: 4em; }
        body.wallboard-mode #incident-display { font-size: 2.8em; }
        body.wallboard-mode .tracker-item .tracker-time { font-size: 2.4em; }
        body.wallboard-mode #shift-countdown-timer { font-size: 3em; }

        #current-date {
            font-size: 1.1em;
            text-align: center;
            color: var(--accent-green);
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .countdown-display h3 { color: var(--accent-blue); margin-bottom: 5px; font-size: 1em; }
        #shift-countdown-timer { font-size: 2em; font-weight: bold; color: var(--text-white); }

        #incident-display {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--warning-yellow);
            text-align: center;
            padding: 10px;
            border: 1px solid var(--warning-yellow);
            border-radius: 3px;
            margin-bottom: 15px;
            background-color: #333;
        }
        
        #incident-name-display {
             font-size: 1.5em;
             font-weight: bold;
             color: var(--accent-blue);
             text-align: center;
             margin-bottom: 15px;
        }

        #incident-log-container {
            background-color: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            flex-grow: 1;
            padding: 10px;
            max-height: 400px;
            overflow-y: auto;
            display: flex; 
            flex-direction: column-reverse; 
        }
        
        body.wallboard-mode #incident-log-container { max-height: 600px; }

        .log-entry { border-bottom: 1px dashed #3a3a3a; padding: 5px 0; font-size: 0.9em; color: #ccc; }
        .log-time { color: var(--accent-blue); font-weight: bold; margin-right: 8px; }

        .toggle-mode-container {
            width: 100%;
            max-width: 1500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        #sync-status {
            font-size: 0.85em;
            color: var(--accent-green);
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 3px;
            border: 1px solid #333;
            cursor: pointer;
        }

        #status-summary {
             display: flex;
             justify-content: space-around;
             margin-bottom: 20px;
             text-align: center;
             background-color: #1a1a1a;
             padding: 10px;
             border-radius: 5px;
        }
        .status-box { padding: 5px 15px; }
        .status-count { font-size: 1.5em; font-weight: bold; color: var(--accent-green); }
        .status-label { font-size: 0.8em; color: #aaa; text-transform: uppercase; }

        .settings-panel {
            background-color: #1a1a1a;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .settings-panel label { font-size: 0.85em; color: #bbb; display: flex; flex-direction: column; gap: 4px; }
        .settings-panel input[type="number"] {
            width: 70px; padding: 5px; background: #3a3a3a; border: 1px solid #555; color: white; font-family: 'Consolas', monospace; border-radius: 3px;
        }
        .settings-panel button {
            padding: 6px 12px; background-color: var(--accent-green); color: var(--bg-dark); border: none; border-radius: 3px; font-weight: bold; cursor: pointer; text-transform: uppercase; align-self: flex-end;
        }

        body.wallboard-mode .incident-controls,
        body.wallboard-mode .tracker-controls,
        body.wallboard-mode .settings-panel,
        body.wallboard-mode #export-log,
        body.wallboard-mode #incident-name-input,
        body.wallboard-mode #unit-category-select,
        body.wallboard-mode #tracker-name-input,
        body.wallboard-mode .tracker-actions {
            display: none !important;
        }
        
        input[type="text"], select {
            padding: 10px; border: 1px solid #555; border-radius: 3px; background-color: #3a3a3a; color: var(--text-white); font-family: 'Consolas', monospace; flex-grow: 1;
        }
        select { flex-grow: 0.5; min-width: 100px; }

        .tracker-controls, .incident-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        
        .tracker-controls button, .incident-controls button, #mode-toggle-button {
            padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: background-color 0.2s;
        }
        #mode-toggle-button { background-color: var(--accent-blue); color: var(--bg-dark); }
        
        #trackers-list { list-style: none; padding: 0; margin: 0; }
        
        .tracker-item {
            display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; background-color: #3a3a3a; border-radius: 5px; border-left: 5px solid var(--cat-unknown); 
        }

        .tracker-item[data-category="MED"] { border-left-color: var(--cat-med); }
        .tracker-item[data-category="FIRE"] { border-left-color: var(--cat-fire); }
        .tracker-item[data-category="PD"] { border-left-color: var(--cat-pd); }
        .tracker-item[data-category="SUPPORT"] { border-left-color: var(--cat-support); }
        .tracker-item[data-category="UNKNOWN"] { border-left-color: var(--cat-unknown); }
        
        .tracker-info { display: flex; flex-direction: column; }
        .tracker-category { font-size: 0.8em; color: #ccc; text-transform: uppercase; }

        .tracker-item.warning-status { background-color: #4a4a3a; }
        .tracker-item.alert-status { background-color: var(--alert-red); border-left: 5px solid var(--text-white) !important; box-shadow: 0 0 10px rgba(220, 53, 69, 0.8); }
        @keyframes pulse {
            0% { background-color: var(--critical-dark-red); }
            50% { background-color: var(--alert-red); }
            100% { background-color: var(--critical-dark-red); }
        }
        .tracker-item.critical-status { animation: pulse 1s infinite alternate; border-left: 5px solid var(--warning-yellow) !important; box-shadow: 0 0 15px var(--alert-red); }

        .tracker-name { font-weight: bold; font-size: 1.2em; color: var(--text-white); text-transform: capitalize; }
        .tracker-time { font-size: 1.6em; color: var(--text-white); text-shadow: 0 0 3px rgba(255, 255, 255, 0.5); }
        
        .check-btn { background-color: var(--text-white); color: var(--bg-dark); font-weight: bolder; }
        .stop-bin, .stop-btn { background-color: var(--alert-red); color: white; }
        .resume-btn { background-color: var(--accent-green); color: var(--bg-dark); }
        .delete-btn { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    
    <div class="toggle-mode-container">
        <div id="sync-status" title="Click to switch between Local Storage and Cloud Bin Sync">🔄 SYNC: LOCAL MODE (CLICK TO TOGGLE CLOUD)</div>
        <button id="mode-toggle-button">ACTIVATE WALLBOARD MODE</button>
    </div>

    <h1><span style="color:var(--accent-green)">// COMMAND</span> <span style="color:var(--text-white)">TIME & INCIDENT SYSTEM</span></h1>

    <div class="main-container">
        <div class="system-time-container">
            <h2>Current System Time</h2>
            <div id="digital-clock"></div>
            <div id="current-date"></div>
            <div class="countdown-display">
                <h3>SHIFT END COUNTDOWN (06:00:00 AM)</h3>
                <div id="shift-countdown-timer">--:--:--</div>
            </div>
        </div>
        
        <div class="incident-management">
            <h2>Incident Command Log <button id="export-log" disabled>EXPORT LOG</button></h2>
            <div id="incident-name-display" style="display:none;"></div>
            <h3 style="color:var(--warning-yellow);">Incident Timer Elapsed:</h3>
            <div id="incident-display">00:00:00.00</div>

            <div class="incident-controls">
                <input type="text" id="incident-name-input" placeholder="ENTER INCIDENT NAME" value="ACTIVE INCIDENT">
                <button id="start-incident">ACTIVATE</button>
                <button id="end-incident" style="display:none;">TERMINATE</button>
            </div>
            
            <h3>Log Entry:</h3>
            <div class="incident-controls">
                <input type="text" id="log-entry-input" placeholder="Enter log details" disabled>
                <button id="add-log" disabled>LOG ENTRY</button>
            </div>
            
            <div id="incident-log-container"></div>
        </div>

        <div class="tracker-section">
            <h2>Unit Status Tracker // Active</h2>
            <div class="settings-panel">
                <label>Warning (min): <input type="number" id="input-warning-min" value="2" min="0" step="0.5"></label>
                <label>Alert (min): <input type="number" id="input-alert-min" value="3" min="0" step="0.5"></label>
                <label>Critical (min): <input type="number" id="input-critical-min" value="5" min="0" step="0.5"></label>
                <button id="update-thresholds-btn">Apply Times</button>
            </div>
            
            <div id="status-summary">
                <div class="status-box" id="total-count"><div class="status-count">0</div><div class="status-label">Total Units</div></div>
                <div class="status-box" id="alert-count"><div class="status-count">0</div><div class="status-label">Alert Status</div></div>
                <div class="status-box" id="halted-count"><div class="status-count">0</div><div class="status-label">Halted Units</div></div>
            </div>

            <div class="tracker-controls">
                <select id="unit-category-select">
                    <option value="UNKNOWN">-- SELECT CATEGORY --</option>
                    <option value="MED">MED (Medical)</option>
                    <option value="FIRE">FIRE (Fire/Rescue)</option>
                    <option value="PD">PD (Police)</option>
                    <option value="SUPPORT">SUPPORT (Logistics/Other)</option>
                </select>
                <input type="text" id="tracker-name-input" placeholder="ENTER UNIT ID / NAME">
                <button id="start-tracker">➕ ACTIVATE UNIT</button>
                <button id="reset-tracker">GLOBAL WIPE</button>
            </div>

            <ul id="trackers-list"></ul>
        </div>
    </div>

    <script>
        const digitalClock = document.getElementById('digital-clock');
        const currentDateDisplay = document.getElementById('current-date');
        const shiftCountdownTimer = document.getElementById('shift-countdown-timer'); 
        const syncStatusDisplay = document.getElementById('sync-status');
        const originalTitle = document.title;
        let alertInterval, beepInterval;
        
        const body = document.body;
        const modeToggleButton = document.getElementById('mode-toggle-button');
        const incidentDisplay = document.getElementById('incident-display');
        const incidentNameInput = document.getElementById('incident-name-input');
        const incidentNameDisplay = document.getElementById('incident-name-display');
        const startIncidentButton = document.jsdelivr ? null : document.getElementById('start-incident'); // standard ref below
        const startIncidentBtn = document.getElementById('start-incident');
        const endIncidentButton = document.getElementById('end-incident');
        const logEntryInput = document.getElementById('log-entry-input');
        const addLogButton = document.getElementById('add-log');
        const exportLogButton = document.getElementById('export-log');
        const incidentLogContainer = document.getElementById('incident-log-container');
        
        const trackersList = document.getElementById('trackers-list');
        const trackerNameInput = document.getElementById('tracker-name-input');
        const startTrackerButton = document.getElementById('start-tracker');
        const resetButton = document.getElementById('reset-tracker');
        const unitCategorySelect = document.getElementById('unit-category-select'); 

        const totalCountDisplay = document.querySelector('#total-count .status-count');
        const alertCountDisplay = document.querySelector('#alert-count .status-count');
        const haltedCountDisplay = document.querySelector('#halted-count .status-count');

        const inputWarningMin = document.getElementById('input-warning-min');
        const inputAlertMin = document.getElementById('input-alert-min');
        const inputCriticalMin = document.getElementById('input-critical-min');
        const updateThresholdsBtn = document.getElementById('update-thresholds-btn');

        let activeTrackers = []; 
        let logHistory = [];
        let mainTimerInterval; 
        let alertIsActive = false;
        
        let TIME_WARNING = 120000;  
        let TIME_ALERT = 180000;    
        let TIME_CRITICAL = 300000; 
        const SHIFT_END_HOUR = 6; 

        let incidentTimer = { isRunning: false, startTime: 0, totalTime: 0, name: "NO ACTIVE INCIDENT" };
        let isWallboardMode = false;
        let isCloudSync = false; // Toggle between local storage and public CORS-safe bin
        let syncChannelId = localStorage.getItem("ics_sync_bin_id") || "fred-dispatch-live-01";

        // Using Npoint.io free CORS JSON bin service for cross-computer state sharing
        const STORAGE_KEY = "ics_dispatch_local_sync_state";

        syncStatusDisplay.addEventListener('click', () => {
            isCloudSync = !isCloudSync;
            if (isCloudSync) {
                let customId = prompt("Enter a shared sync ID/room name for your devices:", syncChannelId);
                if (customId) {
                    syncChannelId = customId.trim();
                    localStorage.setItem("ics_sync_bin_id", syncChannelId);
                }
                syncStatusDisplay.textContent = `☁️ SYNC: CLOUD ACTIVE (${syncChannelId})`;
                syncStatusDisplay.style.color = "var(--accent-blue)";
                pullStateFromCloud();
            } else {
                syncStatusDisplay.textContent = "🔄 SYNC: LOCAL MODE (CLICK TO TOGGLE CLOUD)";
                syncStatusDisplay.style.color = "var(--accent-green)";
            }
        });

        async function pushStateToCloud() {
            const stateData = {
                activeTrackers,
                logHistory,
                incidentTimer,
                thresholds: { warning: TIME_WARNING, alert: TIME_ALERT, critical: TIME_CRITICAL },
                lastUpdated: Date.now()
            };
            
            // Always save locally first
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stateData));

            if (!isCloudSync) return;

            try {
                // Using a public cross-origin echo or bin service if cloud mode is selected
                // For true cross-device persistence without dedicated backend, we push via standard fetch if endpoint allows
                await fetch(`https://api.npoint.io/${syncChannelId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(stateData)
                }).catch(() => {});
            } catch (e) {}
        }

        async function pullStateFromCloud() {
            try {
                let data = null;
                if (isCloudSync) {
                    const response = await fetch(`https://api.npoint.io/${syncChannelId}`).catch(() => null);
                    if (response && response.ok) {
                        data = await response.json();
                    }
                }
                
                if (!data) {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) data = JSON.parse(raw);
                }

                if (data && data.activeTrackers) {
                    if (data.thresholds) {
                        TIME_WARNING = data.thresholds.warning;
                        TIME_ALERT = data.thresholds.alert;
                        TIME_CRITICAL = data.thresholds.critical;
                        inputWarningMin.value = TIME_WARNING / 60000;
                        inputAlertMin.value = TIME_ALERT / 60000;
                        inputCriticalMin.value = TIME_CRITICAL / 60000;
                    }

                    const now = Date.now();
                    activeTrackers = data.activeTrackers.map(t => {
                        const tracker = Object.assign(new UnitTracker(t.name, t.category), t);
                        if (tracker.isRunning) tracker.startTime = now;
                        return tracker;
                    });

                    if (data.incidentTimer) {
                        incidentTimer = data.incidentTimer;
                        if (incidentTimer.isRunning) {
                            incidentTimer.startTime = Date.now();
                            incidentNameInput.style.display = 'none';
                            incidentNameDisplay.textContent = `// ACTIVE INCIDENT: ${incidentTimer.name}`;
                            incidentNameDisplay.style.display = 'block';
                            startIncidentBtn.style.display = 'none';
                            endIncidentButton.style.display = 'block';
                            logEntryInput.disabled = false;
                            addLogButton.disabled = false;
                        } else {
                            incidentNameInput.style.display = 'block';
                            incidentNameDisplay.style.display = 'none';
                            startIncidentBtn.style.display = 'block';
                            endIncidentButton.style.display = 'none';
                            logEntryInput.disabled = true;
                            addLogButton.disabled = true;
                        }
                    }

                    if (data.logHistory && data.logHistory.length !== logHistory.length) {
                        logHistory = data.logHistory;
                        incidentLogContainer.innerHTML = '';
                        logHistory.slice().reverse().forEach(logString => {
                            const match = logString.match(/^\[(.*?)\]\s(.*)$/);
                            const entry = document.createElement('div');
                            entry.className = 'log-entry';
                            if (match) {
                                entry.innerHTML = `<span class="log-time">[${match[1]}]</span> ${match[2]}`;
                            } else {
                                entry.textContent = logString;
                            }
                            incidentLogContainer.appendChild(entry);
                        });
                        exportLogButton.disabled = logHistory.length === 0;
                    }

                    renderTrackers();
                    if ((activeTrackers.length > 0 || incidentTimer.isRunning) && !mainTimerInterval) {
                        startMainUpdateLoop();
                    }
                }
            } catch (e) {}
        }

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY && !isCloudSync) pullStateFromCloud();
        });

        let audioCtx = null;
        function initAudioContext() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }

        function playBeep() {
            try {
                initAudioContext();
                if (!audioCtx || audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
        }

        ['click', 'keydown', 'touchstart'].forEach(eventType => {
            window.addEventListener(eventType, initAudioContext, { once: false, passive: true });
        });

        updateThresholdsBtn.addEventListener('click', () => {
            const warnMin = parseFloat(inputWarningMin.value);
            const alertMin = parseFloat(inputAlertMin.value);
            const critMin = parseFloat(inputCriticalMin.value);
            if (isNaN(warnMin) || isNaN(alertMin) || isNaN(critMin)) {
                alert("Please enter valid numbers.");
                return;
            }
            TIME_WARNING = warnMin * 60000;
            TIME_ALERT = alertMin * 60000;
            TIME_CRITICAL = critMin * 60000;
            logEntry(`THRESHOLDS UPDATED: Warning=${warnMin}m, Alert=${alertMin}m, Critical=${critMin}m`);
            renderTrackers();
            pushStateToCloud();
        });

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const milliseconds = String(Math.floor(ms % 1000 / 10)).padStart(2, '0'); 
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            const minutes = String(Math.floor(totalSeconds / 60) % 60).padStart(2, '0');
            const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}.${milliseconds}`;
        }
        
        function formatTimeHMSS(ms) {
            if (ms <= 0) return "00:00:00";
            const totalSeconds = Math.floor(ms / 1000);
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            const minutes = String(Math.floor(totalSeconds / 60) % 60).padStart(2, '0');
            const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }
        
        function getTrackerStatusClass(time) {
            if (time >= TIME_CRITICAL) return 'critical-status';
            if (time >= TIME_ALERT) return 'alert-status';
            if (time >= TIME_WARNING) return 'warning-status';
            return '';
        }

        class UnitTracker {
            constructor(name, category) {
                this.id = Date.now() + Math.floor(Math.random() * 1000);
                this.name = name;
                this.category = category;
                this.totalTime = 0;
                this.startTime = Date.now();
                this.isRunning = true;
            }
            getTimeElapsed(now) {
                if (this.isRunning) {
                    this.totalTime += (now - this.startTime);
                    this.startTime = now; 
                }
                return this.totalTime;
            }
            getDisplayTime() { return formatTime(this.totalTime); }
            getStatusClass() { return getTrackerStatusClass(this.totalTime); }
            toggle(shouldRun) {
                if (shouldRun !== undefined) this.isRunning = shouldRun;
                else this.isRunning = !this.isRunning;
                if (this.isRunning) this.startTime = Date.now(); 
            }
            checkIn() {
                this.totalTime = 0;
                this.startTime = Date.now();
                this.isRunning = true;
            }
        }

        function updateShiftCountdown() {
            const now = new Date();
            let shiftEnd = new Date(now);
            shiftEnd.setHours(SHIFT_END_HOUR, 0, 0, 0);
            if (now.getTime() >= shiftEnd.getTime()) shiftEnd.setDate(shiftEnd.getDate() + 1);
            const timeRemaining = shiftEnd.getTime() - now.getTime();
            shiftCountdownTimer.textContent = formatTimeHMSS(timeRemaining);
            shiftCountdownTimer.style.color = timeRemaining < 3600000 ? 'var(--warning-yellow)' : 'var(--text-white)';
        }

        function updateGlobalClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0').slice(0, 2); 
            digitalClock.textContent = `${hours}:${minutes}:${seconds}.${milliseconds}`;
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            currentDateDisplay.textContent = `${dateStr.toUpperCase()} ZULU ${timeStr.toUpperCase()}`;
            updateShiftCountdown();
        }
        setInterval(updateGlobalClock, 100); 
        updateGlobalClock(); 
        
        function toggleTitleAlert() {
            document.title = document.title === originalTitle ? `*** ALERT *** ${originalTitle}` : originalTitle;
        }

        function setAlertStatus(isActive) {
            if (isActive === alertIsActive) return;
            alertIsActive = isActive;
            if (alertIsActive) {
                if (!alertInterval) alertInterval = setInterval(toggleTitleAlert, 500); 
                playBeep();
                if (!beepInterval) beepInterval = setInterval(playBeep, 1200); 
            } else {
                clearInterval(alertInterval);
                alertInterval = null;
                clearInterval(beepInterval);
                beepInterval = null;
                document.title = originalTitle;
            }
        }

        modeToggleButton.addEventListener('click', () => {
            isWallboardMode = !isWallboardMode;
            if (isWallboardMode) {
                body.classList.add('wallboard-mode');
                modeToggleButton.textContent = 'EXIT WALLBOARD MODE';
                modeToggleButton.style.backgroundColor = 'var(--alert-red)';
            } else {
                body.classList.remove('wallboard-mode');
                modeToggleButton.textContent = 'ACTIVATE WALLBOARD MODE';
                modeToggleButton.style.backgroundColor = 'var(--accent-blue)';
            }
            renderTrackers();
        });

        function scrollLog() { incidentLogContainer.scrollTop = 0; }

        function updateIncidentTimer() {
            if (incidentTimer.isRunning) {
                const now = Date.now();
                const elapsedTime = now - incidentTimer.startTime;
                incidentTimer.totalTime += elapsedTime;
                incidentTimer.startTime = now;
                incidentDisplay.textContent = formatTime(incidentTimer.totalTime);
            }
        }
        
        function logEntry(text) {
            const now = new Date();
            const timestamp = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const logString = `[${timestamp}] ${text}`;
            logHistory.push(logString);

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${timestamp}]</span> ${text}`;
            incidentLogContainer.prepend(entry);
            exportLogButton.disabled = logHistory.length === 0;
            scrollLog();
        }

        startIncidentBtn.addEventListener('click', () => {
            if (!incidentTimer.isRunning) {
                const name = incidentNameInput.value.trim().toUpperCase() || "UNNAMED INCIDENT";
                incidentTimer.isRunning = true;
                incidentTimer.startTime = Date.now();
                incidentTimer.totalTime = 0;
                incidentTimer.name = name; 

                incidentNameInput.style.display = 'none';
                incidentNameDisplay.textContent = `// ACTIVE INCIDENT: ${name}`;
                incidentNameDisplay.style.display = 'block';
                startIncidentBtn.style.display = 'none';
                endIncidentButton.style.display = 'block';
                logEntryInput.disabled = false;
                addLogButton.disabled = false;

                logEntry(`INCIDENT ACTIVATED: ${name}.`);
                if (!mainTimerInterval) startMainUpdateLoop(); 
                pushStateToCloud();
            }
        });

        endIncidentButton.addEventListener('click', () => {
            if (incidentTimer.isRunning) {
                incidentTimer.isRunning = false;
                logEntry(`INCIDENT TERMINATED: ${incidentTimer.name}. Total: ${formatTime(incidentTimer.totalTime)}`);
                
                incidentNameInput.style.display = 'block';
                incidentNameDisplay.style.display = 'none';
                startIncidentBtn.style.display = 'block';
                endIncidentButton.style.display = 'none';
                logEntryInput.disabled = true;
                addLogButton.disabled = true;
                incidentDisplay.textContent = formatTime(incidentTimer.totalTime);
                
                if (activeTrackers.length === 0) stopMainUpdateLoop();
                pushStateToCloud();
            }
        });

        addLogButton.addEventListener('click', () => {
            const entryText = logEntryInput.value.trim();
            if (entryText && incidentTimer.isRunning) {
                logEntry(entryText.toUpperCase());
                logEntryInput.value = '';
                pushStateToCloud();
            }
        });
        
        logEntryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addLogButton.click(); }
        });
        
        exportLogButton.addEventListener('click', () => {
            const logText = logHistory.slice().reverse().join('\n');
            const filename = `ICS_Log_${Date.now()}.txt`;
            const blob = new Blob([logText], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        });

        function updateStatusSummary() {
            const alerts = activeTrackers.filter(t => t.totalTime >= TIME_ALERT).length; 
            totalCountDisplay.textContent = activeTrackers.length;
            alertCountDisplay.textContent = alerts;
            haltedCountDisplay.textContent = activeTrackers.filter(t => !t.isRunning).length;
            setAlertStatus(alerts > 0);
        }

        function attachUnitActionListeners() {
            trackersList.onclick = (e) => {
                const button = e.target.closest('button');
                if (!button) return;
                const li = e.target.closest('.tracker-item');
                if (!li) return;
                
                const id = parseInt(li.getAttribute('data-id'));
                const tracker = activeTrackers.find(t => t.id === id);
                if (!tracker) return;

                if (button.classList.contains('stop-btn') || button.classList.contains('stop-bin')) {
                    tracker.toggle();
                    logEntry(`UNIT STATUS CHANGE: ${tracker.name} is now ${tracker.isRunning ? 'RESUMED' : 'HALTED'}.`);
                } else if (button.classList.contains('check-btn')) {
                    tracker.checkIn();
                    logEntry(`UNIT CHECK-IN: ${tracker.name} reset.`);
                } else if (button.classList.contains('delete-btn')) {
                    deleteUnit(id);
                    return; 
                }
                renderTrackers();
                pushStateToCloud();
            };
        }

        function renderTrackers() {
            trackersList.innerHTML = ''; 
            activeTrackers.forEach(tracker => {
                const li = document.createElement('li');
                li.className = `tracker-item ${tracker.getStatusClass()}`;
                li.setAttribute('data-id', tracker.id);
                li.setAttribute('data-category', tracker.category.toUpperCase());

                let actionButtonHTML = '';
                let purgeButtonHTML = '';
                if (!isWallboardMode) {
                    const isAlertOrHigher = tracker.totalTime >= TIME_ALERT;
                    if (isAlertOrHigher && tracker.isRunning) {
                        actionButtonHTML = `<button class="check-btn">✅ CHECK</button>`;
                    } else if (tracker.isRunning) {
                        actionButtonHTML = `<button class="stop-bin">HALT</button>`;
                    } else {
                        actionButtonHTML = `<button class="resume-btn">RESUME</button>`;
                    }
                    purgeButtonHTML = `<button class="delete-btn">PURGE</button>`;
                }

                li.innerHTML = `
                    <div class="tracker-info">
                        <span class="tracker-name">${tracker.name}</span>
                        <span class="tracker-category">${tracker.category}</span>
                    </div>
                    <span class="tracker-time">${tracker.getDisplayTime()}</span>
                    <div class="tracker-actions">
                        ${actionButtonHTML}
                        ${purgeButtonHTML}
                    </div>
                `;
                trackersList.appendChild(li);
            });
            updateStatusSummary();
        }
        
        startTrackerButton.addEventListener('click', () => {
            const name = trackerNameInput.value.trim().toUpperCase() || "UNNAMED UNIT";
            const category = unitCategorySelect.value.toUpperCase(); 
            const newTracker = new UnitTracker(name, category);
            activeTrackers.push(newTracker);
            trackerNameInput.value = ''; 
            unitCategorySelect.value = 'UNKNOWN';
            logEntry(`UNIT ACTIVATED: ${name} (${category})`);
            if (!mainTimerInterval) startMainUpdateLoop();
            renderTrackers();
            pushStateToCloud();
        });

        function deleteUnit(id) {
            const tracker = activeTrackers.find(t => t.id === id);
            if (tracker) logEntry(`UNIT PURGED: ${tracker.name}`);
            activeTrackers = activeTrackers.filter(t => t.id !== id);
            renderTrackers();
            if (activeTrackers.length === 0 && !incidentTimer.isRunning) stopMainUpdateLoop();
            pushStateToCloud();
        }

        resetButton.addEventListener('click', () => {
            if (confirm("Purge ALL unit trackers?")) {
                activeTrackers = [];
                if (!incidentTimer.isRunning) stopMainUpdateLoop();
                renderTrackers();
                logEntry("GLOBAL WIPE executed.");
                pushStateToCloud();
            }
        });

        function updateMainTimers() {
            const now = Date.now();
            let needsFullRender = false; 
            updateIncidentTimer();

            activeTrackers.forEach(tracker => {
                if (tracker.isRunning) {
                    const wasState = tracker.getStatusClass();
                    tracker.getTimeElapsed(now);
                    const newState = tracker.getStatusClass();
                    if (wasState !== newState) {
                        needsFullRender = true;
                    }
                    const timeSpan = trackersList.querySelector(`[data-id="${tracker.id}"] .tracker-time`);
                    if (timeSpan) timeSpan.textContent = tracker.getDisplayTime();
                }
            });
            if (needsFullRender) renderTrackers(); 
        }

        function startMainUpdateLoop() {
            if (mainTimerInterval) clearInterval(mainTimerInterval);
            mainTimerInterval = setInterval(updateMainTimers, 10);
        }
        
        function stopMainUpdateLoop() {
             if (mainTimerInterval) { clearInterval(mainTimerInterval); mainTimerInterval = null; }
        }

        async function initializeApp() {
            attachUnitActionListeners();
            await pullStateFromCloud();
            // Poll every 3 seconds for cross-device sync updates
            setInterval(pullStateFromCloud, 3000);
            trackerNameInput.addEventListener('keypress', (e) => {
                 if (e.key === 'Enter') startTrackerButton.click();
            });
        }

        initializeApp(); 
    </script>
</body>
</html>
